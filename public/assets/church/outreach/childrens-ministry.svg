<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="schoolSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#schoolSky)"/>
  <rect y="520" width="1200" height="280" fill="url(#groundGrad)"/>

  <!-- School Buildings in Background -->
  <rect x="150" y="320" width="900" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <polygon points="120,320 600,200 1080,320" fill="#047857" stroke="#065f46" stroke-width="4"/>
  <!-- Windows -->
  <g fill="#0284c7" stroke="#0369a1" stroke-width="2">
    <rect x="220" y="370" width="80" height="90" rx="4"/>
    <rect x="360" y="370" width="80" height="90" rx="4"/>
    <rect x="500" y="370" width="80" height="90" rx="4"/>
    <rect x="640" y="370" width="80" height="90" rx="4"/>
    <rect x="780" y="370" width="80" height="90" rx="4"/>
    <rect x="920" y="370" width="80" height="90" rx="4"/>
  </g>
  
  <!-- School Signboard -->
  <rect x="380" y="270" width="440" height="40" rx="6" fill="#15803d" stroke="#facc15" stroke-width="2"/>
  <text x="600" y="297" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VICTORIOUS HERITAGE PRIMARY SCHOOL</text>

  <!-- National Flagpole -->
  <line x1="200" y1="220" x2="200" y2="600" stroke="#64748b" stroke-width="6"/>
  <!-- South Sudan Flag representation -->
  <g transform="translate(203, 230)">
    <rect width="90" height="18" fill="#000000"/>
    <rect y="18" width="90" height="6" fill="#ffffff"/>
    <rect y="24" width="90" height="18" fill="#dc2626"/>
    <rect y="42" width="90" height="6" fill="#ffffff"/>
    <rect y="48" width="90" height="18" fill="#16a34a"/>
    <polygon points="0,0 45,33 0,66" fill="#2563eb"/>
    <circle cx="15" cy="33" r="5" fill="#facc15"/>
  </g>

  <!-- Pupils in Bright Yellow Victorious Heritage Uniforms -->
  <g transform="translate(600, 620)">
    <!-- Row of Children standing in assembly formation -->
    <g transform="translate(-320, 0)">
      <ellipse cx="0" cy="-60" rx="16" ry="18" fill="#78350f"/>
      <path d="M -22,-40 L 22,-40 L 26,40 L -26,40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M -20,40 L 20,40 L 22,80 L -22,80 Z" fill="#1e3a8a"/>
    </g>
    <g transform="translate(-200, 10)">
      <ellipse cx="0" cy="-60" rx="16" ry="18" fill="#78350f"/>
      <path d="M -22,-40 L 22,-40 L 26,40 L -26,40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M -20,40 L 20,40 L 22,80 L -22,80 Z" fill="#1e3a8a"/>
    </g>
    <g transform="translate(-80, 20)">
      <ellipse cx="0" cy="-60" rx="16" ry="18" fill="#78350f"/>
      <path d="M -22,-40 L 22,-40 L 26,40 L -26,40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M -20,40 L 20,40 L 22,80 L -22,80 Z" fill="#1e3a8a"/>
    </g>
    <g transform="translate(40, 20)">
      <ellipse cx="0" cy="-60" rx="16" ry="18" fill="#78350f"/>
      <path d="M -22,-40 L 22,-40 L 26,40 L -26,40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M -20,40 L 20,40 L 22,80 L -22,80 Z" fill="#1e3a8a"/>
    </g>
    <g transform="translate(160, 10)">
      <ellipse cx="0" cy="-60" rx="16" ry="18" fill="#78350f"/>
      <path d="M -22,-40 L 22,-40 L 26,40 L -26,40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M -20,40 L 20,40 L 22,80 L -22,80 Z" fill="#1e3a8a"/>
    </g>
    <g transform="translate(280, 0)">
      <ellipse cx="0" cy="-60" rx="16" ry="18" fill="#78350f"/>
      <path d="M -22,-40 L 22,-40 L 26,40 L -26,40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M -20,40 L 20,40 L 22,80 L -22,80 Z" fill="#1e3a8a"/>
    </g>
  </g>

  <!-- Banner footer -->
  <rect x="0" y="740" width="1200" height="60" fill="#0f172a" opacity="0.9"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#facc15" text-anchor="middle">Morning Assembly &amp; Devotions · Victorious Heritage Primary School, Juba</text>
</svg>
