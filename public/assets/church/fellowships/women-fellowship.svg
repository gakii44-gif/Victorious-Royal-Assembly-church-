<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="womenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <pattern id="africanKitenge" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 20,0 L 40,20 L 20,40 Z" fill="#fbbf24" opacity="0.15"/>
      <circle cx="20" cy="20" r="6" fill="#f43f5e" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#womenGrad)"/>
  <rect width="1200" height="800" fill="url(#africanKitenge)"/>

  <!-- Title & Banner -->
  <text x="600" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">WOMEN FELLOWSHIP &amp; MOTHERS UNION</text>
  <text x="600" y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fecdd3" text-anchor="middle" letter-spacing="2">VICTORIOUS ROYAL ASSEMBLY INTERNATIONAL · JUBA</text>

  <!-- Group of Women in Beautiful Commemorative African Print Attire -->
  <g transform="translate(600, 480)">
    <!-- Center Sister (Fellowship Leader) -->
    <g transform="translate(0, 0)">
      <path d="M -70,260 L -60,60 L 60,60 L 70,260 Z" fill="#f59e0b" stroke="#fef3c7" stroke-width="2"/>
      <!-- Pattern sash -->
      <path d="M -40,60 L 60,260 L 20,260 L -60,100 Z" fill="#e11d48"/>
      <!-- Headwrap Gele -->
      <path d="M -45,-30 Q 0,-70 45,-30 Q 55,-60 0,-75 Q -55,-60 -45,-30 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
      <ellipse cx="0" cy="-20" rx="30" ry="35" fill="#78350f"/>
    </g>

    <!-- Sister Left -->
    <g transform="translate(-160, 20)">
      <path d="M -60,240 L -50,60 L 50,60 L 60,240 Z" fill="#059669" stroke="#a7f3d0" stroke-width="2"/>
      <path d="M -35,-30 Q 0,-65 35,-30 Q 45,-55 0,-70 Q -45,-55 -35,-30 Z" fill="#059669" stroke="#34d399" stroke-width="2"/>
      <ellipse cx="0" cy="-20" rx="28" ry="32" fill="#78350f"/>
    </g>

    <!-- Sister Right -->
    <g transform="translate(160, 20)">
      <path d="M -60,240 L -50,60 L 50,60 L 60,240 Z" fill="#8b5cf6" stroke="#ddd6fe" stroke-width="2"/>
      <path d="M -35,-30 Q 0,-65 35,-30 Q 45,-55 0,-70 Q -45,-55 -35,-30 Z" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2"/>
      <ellipse cx="0" cy="-20" rx="28" ry="32" fill="#78350f"/>
    </g>

    <!-- Outer Sisters -->
    <g transform="translate(-310, 40)">
      <path d="M -55,220 L -45,55 L 45,55 L 55,220 Z" fill="#ea580c"/>
      <ellipse cx="0" cy="-15" rx="26" ry="30" fill="#78350f"/>
      <path d="M -30,-25 Q 0,-55 30,-25 Z" fill="#ea580c"/>
    </g>
    <g transform="translate(310, 40)">
      <path d="M -55,220 L -45,55 L 45,55 L 55,220 Z" fill="#0284c7"/>
      <ellipse cx="0" cy="-15" rx="26" ry="30" fill="#78350f"/>
      <path d="M -30,-25 Q 0,-55 30,-25 Z" fill="#0284c7"/>
    </g>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="730" width="1200" height="70" fill="#290310" opacity="0.95"/>
  <text x="600" y="772" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Annual Women's Anniversary · Mothers Prayer Altar &amp; Widow Care Ministry</text>
</svg>
