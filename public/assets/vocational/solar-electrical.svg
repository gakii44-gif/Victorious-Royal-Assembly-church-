<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#solarBg)"/>

  <text x="600" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">SOLAR PHOTOVOLTAIC &amp; ELECTRICAL TRADES</text>
  <text x="600" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#bae6fd" text-anchor="middle">Renewable Off-Grid Power Engineering for Communities</text>

  <!-- Solar PV Panel Array in Bright Sun -->
  <g transform="translate(600, 440)">
    <!-- Sun -->
    <circle cx="280" cy="-200" r="60" fill="#facc15" opacity="0.9"/>
    
    <!-- Tilted Solar Panel -->
    <polygon points="-300,120 300,120 220,-120 -220,-120" fill="#1e3a8a" stroke="#38bdf8" stroke-width="4"/>
    <!-- Grid Lines -->
    <line x1="-200" y1="120" x2="-150" y2="-120" stroke="#60a5fa" stroke-width="2"/>
    <line x1="-100" y1="120" x2="-70" y2="-120" stroke="#60a5fa" stroke-width="2"/>
    <line x1="0" y1="120" x2="0" y2="-120" stroke="#60a5fa" stroke-width="2"/>
    <line x1="100" y1="120" x2="70" y2="-120" stroke="#60a5fa" stroke-width="2"/>
    <line x1="200" y1="120" x2="150" y2="-120" stroke="#60a5fa" stroke-width="2"/>

    <line x1="-240" y1="-40" x2="240" y2="-40" stroke="#60a5fa" stroke-width="2"/>
    <line x1="-265" y1="40" x2="265" y2="40" stroke="#60a5fa" stroke-width="2"/>

    <!-- Inverter & Battery Bank -->
    <g transform="translate(-250, 160)">
      <rect width="140" height="90" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="30" cy="40" r="12" fill="#22c55e"/>
      <rect x="60" y="30" width="60" height="20" rx="3" fill="#0f172a"/>
      <text x="90" y="45" font-family="monospace" font-size="12" fill="#22c55e" text-anchor="middle">13.8V</text>
    </g>

    <!-- Digital Multimeter Tester -->
    <g transform="translate(140, 160)">
      <rect width="90" height="110" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
      <rect x="15" y="20" width="60" height="30" rx="4" fill="#0f172a"/>
      <text x="45" y="42" font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle">230V</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#0b132b" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Clean Energy Installation, Battery Inverters &amp; Off-Grid Electrification Skills</text>
</svg>
