<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="carpBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#carpBg)"/>

  <text x="600" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">CARPENTRY &amp; FURNITURE WORKSHOP</text>
  <text x="600" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fed7aa" text-anchor="middle">Building Sturdy Classroom Desks &amp; Building Trades</text>

  <!-- Heavy Timber Workbench & Tools -->
  <g transform="translate(600, 480)">
    <!-- Workbench Top -->
    <rect x="-400" y="0" width="800" height="60" rx="4" fill="#a16207" stroke="#b45309" stroke-width="3"/>
    <rect x="-360" y="60" width="40" height="180" fill="#78350f"/>
    <rect x="320" y="60" width="40" height="180" fill="#78350f"/>

    <!-- Hand Plane (Woodworking) -->
    <g transform="translate(-180, -25)">
      <rect x="-60" y="-15" width="120" height="40" rx="4" fill="#78350f" stroke="#451a03"/>
      <polygon points="10,-15 30,-35 40,-35 25,-15" fill="#94a3b8"/>
      <!-- Wood shaving curls -->
      <path d="M 65,0 Q 80,-20 95,-5 Q 110,10 125,-10" fill="none" stroke="#fef08a" stroke-width="3"/>
    </g>

    <!-- Hand Saw -->
    <g transform="translate(140, -20) rotate(-15)">
      <polygon points="-80,-10 60,-5 60,15 -80,25" fill="#cbd5e1" stroke="#64748b"/>
      <rect x="-105" y="-5" width="30" height="40" rx="6" fill="#b91c1c"/>
    </g>

    <!-- Timber Planks in Progress -->
    <rect x="-300" y="-10" width="100" height="20" fill="#d97706"/>
    <rect x="240" y="-10" width="120" height="20" fill="#d97706"/>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#1c1917" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Equipping South Sudanese Youth with Sustainable Construction &amp; Joinery Trades</text>
</svg>
