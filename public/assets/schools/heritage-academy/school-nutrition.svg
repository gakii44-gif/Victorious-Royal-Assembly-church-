<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="diningBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#diningBg)"/>
  
  <!-- Dining Canopy Pavilion -->
  <polygon points="100,280 600,140 1100,280" fill="#f59e0b" stroke="#d97706" stroke-width="4"/>
  <rect x="180" y="280" width="16" height="350" fill="#78350f"/>
  <rect x="592" y="260" width="16" height="370" fill="#78350f"/>
  <rect x="1004" y="280" width="16" height="350" fill="#78350f"/>

  <!-- Dining Tables with Bowls & Fruits -->
  <g transform="translate(600, 560)">
    <rect x="-420" y="0" width="840" height="60" rx="6" fill="#a16207" stroke="#78350f" stroke-width="3"/>
    
    <!-- Warm Bowls of Porridge -->
    <g transform="translate(-280, -20)">
      <ellipse cx="0" cy="15" rx="35" ry="16" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <path d="M -35,15 Q 0,45 35,15 Z" fill="#eab308"/>
      <path d="M -10,0 Q -15,-20 -5,-35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
    <g transform="translate(-90, -20)">
      <ellipse cx="0" cy="15" rx="35" ry="16" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <path d="M -35,15 Q 0,45 35,15 Z" fill="#eab308"/>
      <path d="M -10,0 Q -15,-20 -5,-35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
    <g transform="translate(100, -20)">
      <ellipse cx="0" cy="15" rx="35" ry="16" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <path d="M -35,15 Q 0,45 35,15 Z" fill="#eab308"/>
      <path d="M -10,0 Q -15,-20 -5,-35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
    <g transform="translate(290, -20)">
      <ellipse cx="0" cy="15" rx="35" ry="16" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <path d="M -35,15 Q 0,45 35,15 Z" fill="#eab308"/>
      <path d="M -10,0 Q -15,-20 -5,-35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
  </g>

  <!-- Pupils Seated Eating with Joy -->
  <g transform="translate(600, 480)">
    <g transform="translate(-280, 0)">
      <ellipse cx="0" cy="-30" rx="18" ry="22" fill="#78350f"/>
      <path d="M -24,-5 L 24,-5 L 26,60 L -26,60 Z" fill="#facc15"/>
    </g>
    <g transform="translate(-90, 0)">
      <ellipse cx="0" cy="-30" rx="18" ry="22" fill="#78350f"/>
      <path d="M -24,-5 L 24,-5 L 26,60 L -26,60 Z" fill="#facc15"/>
    </g>
    <g transform="translate(100, 0)">
      <ellipse cx="0" cy="-30" rx="18" ry="22" fill="#78350f"/>
      <path d="M -24,-5 L 24,-5 L 26,60 L -26,60 Z" fill="#facc15"/>
    </g>
    <g transform="translate(290, 0)">
      <ellipse cx="0" cy="-30" rx="18" ry="22" fill="#78350f"/>
      <path d="M -24,-5 L 24,-5 L 26,60 L -26,60 Z" fill="#facc15"/>
    </g>
  </g>

  <!-- Title Top -->
  <text x="600" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PUPIL NUTRITION &amp; DAILY MEALS</text>
  <text x="600" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fef08a" text-anchor="middle">Victorious Heritage Primary School · Hot Morning Porridge Program</text>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#14532d" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Every Child Fed, Focused, and Thriving in School</text>
</svg>
