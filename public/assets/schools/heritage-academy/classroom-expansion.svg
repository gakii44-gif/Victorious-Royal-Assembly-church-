<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#expBg)"/>

  <!-- Construction / Workshop Elements -->
  <text x="600" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">CLASSROOM DESKS &amp; EXPANSION</text>
  <text x="600" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0" text-anchor="middle">Equipping Victorious Heritage Primary School Classrooms</text>

  <!-- Crafted Timber Dual Writing Desks -->
  <g transform="translate(600, 480)">
    <!-- Desk 1 (foreground) -->
    <path d="M -280,-40 L 280,-40 L 320,40 L -320,40 Z" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <!-- Bench attached -->
    <path d="M -260,110 L 260,110 L 280,150 L -280,150 Z" fill="#92400e" stroke="#78350f" stroke-width="3"/>
    <!-- Iron frame legs -->
    <rect x="-240" y="40" width="20" height="180" fill="#334155"/>
    <rect x="220" y="40" width="20" height="180" fill="#334155"/>
    <rect x="-250" y="150" width="20" height="70" fill="#334155"/>
    <rect x="230" y="150" width="20" height="70" fill="#334155"/>

    <!-- School Books & Pencils on Desk -->
    <polygon points="-120,-10 -60,-10 -50,15 -130,15" fill="#38bdf8" stroke="#0284c7"/>
    <polygon points="40,-10 110,-10 120,15 30,15" fill="#f43f5e" stroke="#e11d48"/>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#022c22" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Locally Built Dual Writing Desks · No Child Sits on the Floor</text>
</svg>
