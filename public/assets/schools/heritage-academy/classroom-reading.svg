<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="classWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#classWall)"/>
  
  <!-- Blackboard -->
  <rect x="250" y="80" width="700" height="320" rx="10" fill="#14532d" stroke="#78350f" stroke-width="12"/>
  <text x="600" y="140" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#fef08a" text-anchor="middle">VICTORIOUS HERITAGE PRIMARY SCHOOL</text>
  <line x1="300" y1="160" x2="900" y2="160" stroke="#fef08a" stroke-width="2" stroke-dasharray="8,6"/>
  
  <text x="320" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Theme: Foundational Literacy &amp; South Sudan Curriculum</text>
  <text x="320" y="250" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#86efac">1. English Reading &amp; Phonics: "Knowledge is Light"</text>
  <text x="320" y="290" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#86efac">2. Mathematics: Addition, Multiplication, Measurement</text>
  <text x="320" y="330" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#86efac">3. Science &amp; Health: Nutrition, Clean Water &amp; Sanitation</text>
  <text x="320" y="370" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" fill="#facc15" font-style="italic">Proverbs 22:6 — "Train up a child in the way he should go..."</text>

  <!-- Wooden Desks & Seated Children -->
  <g transform="translate(600, 560)">
    <!-- Main Double Desk -->
    <rect x="-350" y="40" width="700" height="70" rx="4" fill="#a16207" stroke="#78350f" stroke-width="3"/>
    <rect x="-320" y="110" width="40" height="130" fill="#78350f"/>
    <rect x="280" y="110" width="40" height="130" fill="#78350f"/>

    <!-- Left Child at Desk -->
    <g transform="translate(-180, 0)">
      <ellipse cx="0" cy="-60" rx="20" ry="24" fill="#78350f"/>
      <path d="M -30,-30 L 30,-30 L 35,50 L -35,50 Z" fill="#facc15"/>
      <!-- Exercise Book -->
      <polygon points="-40,45 20,45 30,35 -30,35" fill="#ffffff" stroke="#94a3b8"/>
      <!-- Pen/Pencil in Hand -->
      <line x1="20" y1="40" x2="35" y2="25" stroke="#dc2626" stroke-width="3"/>
    </g>

    <!-- Right Child at Desk -->
    <g transform="translate(180, 0)">
      <ellipse cx="0" cy="-60" rx="20" ry="24" fill="#78350f"/>
      <path d="M -30,-30 L 30,-30 L 35,50 L -35,50 Z" fill="#facc15"/>
      <!-- Reading Book Opened -->
      <polygon points="-30,45 30,45 40,35 -20,35" fill="#ffffff" stroke="#94a3b8"/>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="0" y="740" width="1200" height="60" fill="#1e293b" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Active Classroom Learning · Equipping 350+ Children with Foundational Skills in Juba</text>
</svg>
