<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dedSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#dedSky)"/>

  <text x="600" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">THANKSGIVING &amp; CHILD DEDICATION</text>
  <text x="600" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ccfbf1" text-anchor="middle" letter-spacing="2">Victorious Royal Assembly International · Altar Dedications</text>

  <!-- Pastor & Parents at Altar Dedicating Child -->
  <g transform="translate(600, 500)">
    <!-- Altar Table with White Linen -->
    <rect x="-350" y="100" width="700" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="160" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f766e" text-anchor="middle" letter-spacing="2">DEDICATED UNTO THE LORD</text>

    <!-- Pastor (Center Left) in Pastoral Robe -->
    <g transform="translate(-80, 0)">
      <ellipse cx="0" cy="-110" rx="20" ry="24" fill="#78350f"/>
      <path d="M -35,-80 L 35,-80 L 40,110 L -40,110 Z" fill="#134e4a"/>
      <!-- Pastoral Stole (Gold) -->
      <path d="M -20,-80 L -10,80 L 0,80 L 10,-80" fill="none" stroke="#facc15" stroke-width="12"/>
      <!-- Hands outstretched in blessing over child -->
      <line x1="25" y1="-30" x2="65" y2="-10" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Mother Holding Child in White Dedication Blanket (Center Right) -->
    <g transform="translate(90, 0)">
      <ellipse cx="0" cy="-110" rx="18" ry="22" fill="#78350f"/>
      <path d="M -30,-80 L 30,-80 L 35,110 L -35,110 Z" fill="#0284c7"/>
      <!-- Dedicated Infant in White Shawl -->
      <g transform="translate(-40, -10)">
        <ellipse cx="0" cy="0" rx="26" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
        <ellipse cx="-16" cy="-4" rx="10" ry="10" fill="#78350f"/>
        <circle cx="-16" cy="-4" r="6" fill="#fbcfe8" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- Heavenly Dove of Blessing -->
  <g transform="translate(600, 240) scale(0.9)">
    <circle cx="0" cy="0" r="80" fill="#fef08a" opacity="0.2"/>
    <path d="M 0,-25 Q 25,-12 40,6 Q 60,0 80,-12 Q 65,24 40,30 Q 12,30 0,42 Q -12,30 -40,30 Q -65,24 -80,-12 Q -60,0 -40,6 Q -25,-12 0,-25 Z" fill="#ffffff" stroke="#fef08a" stroke-width="3"/>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#042f2e" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">"For this child I prayed, and the Lord has granted me my petition" · 1 Samuel 1:27</text>
</svg>
