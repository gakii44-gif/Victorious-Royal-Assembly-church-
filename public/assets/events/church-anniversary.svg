<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="churchAnniSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="jubileeBurst" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#churchAnniSky)"/>
  <circle cx="600" cy="300" r="450" fill="url(#jubileeBurst)"/>

  <!-- Grand Festive Church Anniversary Banner -->
  <g transform="translate(600, 160)">
    <rect x="-420" y="0" width="840" height="90" rx="12" fill="#78350f" stroke="#facc15" stroke-width="4"/>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">CHURCH ANNUAL CONVENTION &amp; ANNIVERSARY</text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="2">VICTORIOUS ROYAL ASSEMBLY INTERNATIONAL · JUBA</text>
  </g>

  <!-- Sanctuary Festive Architecture with Confetti & Praise Flags -->
  <g transform="translate(600, 480)">
    <!-- Church Pulpit & Cross -->
    <rect x="-240" y="100" width="480" height="150" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
    <rect x="-10" y="-120" width="20" height="220" rx="4" fill="#facc15"/>
    <rect x="-60" y="-70" width="120" height="20" rx="4" fill="#facc15"/>
    
    <!-- Celebration Jubilee Ribbon Arc -->
    <path d="M -380,180 Q 0,-240 380,180" fill="none" stroke="#fef08a" stroke-width="8" stroke-dasharray="16,12"/>
    
    <!-- Praise Choir & Congregation with instruments -->
    <g fill="#022c22">
      <path d="M -260,200 Q -240,110 -210,110 Q -180,110 -160,200 Z"/>
      <ellipse cx="-210" cy="80" rx="16" ry="20" fill="#78350f"/>
      <path d="M -80,200 Q -60,100 -30,100 Q 0,100 20,200 Z"/>
      <ellipse cx="-30" cy="70" rx="16" ry="20" fill="#78350f"/>
      <path d="M 120,200 Q 140,110 170,110 Q 200,110 220,200 Z"/>
      <ellipse cx="170" cy="80" rx="16" ry="20" fill="#78350f"/>
    </g>
  </g>

  <!-- Floating Streamers / Confetti -->
  <g fill="#facc15" opacity="0.8">
    <circle cx="200" cy="280" r="8"/>
    <circle cx="320" cy="220" r="6"/>
    <circle cx="880" cy="240" r="7"/>
    <circle cx="1020" cy="300" r="9"/>
    <rect x="250" y="320" width="8" height="18" rx="2" transform="rotate(25 250 320)" fill="#f43f5e"/>
    <rect x="950" y="270" width="8" height="18" rx="2" transform="rotate(-35 950 270)" fill="#38bdf8"/>
  </g>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#022c22" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Annual Convention, Spiritual Milestones &amp; Thanksgiving Altar in Juba, South Sudan</text>
</svg>
