<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="weddingSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <radialGradient id="haloLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a044e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#weddingSky)"/>
  <circle cx="600" cy="350" r="400" fill="url(#haloLight)"/>

  <!-- Floral Wedding Ceremony Arch -->
  <g transform="translate(600, 420)">
    <!-- Wooden / Golden Arch -->
    <path d="M -350,320 L -350,-100 Q 0,-340 350,-100 L 350,320" fill="none" stroke="#facc15" stroke-width="12"/>
    <path d="M -330,320 L -330,-90 Q 0,-310 330,-90 L 330,320" fill="none" stroke="#fef08a" stroke-width="4"/>

    <!-- Floral Bouquets & Foliage on Arch -->
    <g fill="#ec4899">
      <circle cx="0" cy="-280" r="28"/>
      <circle cx="-35" cy="-265" r="22"/>
      <circle cx="35" cy="-265" r="22"/>
      <circle cx="-250" cy="-140" r="25"/>
      <circle cx="250" cy="-140" r="25"/>
    </g>
    <g fill="#f43f5e">
      <circle cx="-15" cy="-275" r="18"/>
      <circle cx="15" cy="-275" r="18"/>
      <circle cx="-235" cy="-155" r="18"/>
      <circle cx="235" cy="-155" r="18"/>
    </g>
    <g fill="#ffffff">
      <circle cx="0" cy="-280" r="12"/>
      <circle cx="-250" cy="-140" r="10"/>
      <circle cx="250" cy="-140" r="10"/>
    </g>
  </g>

  <!-- Golden Interlocking Wedding Rings Above Arch -->
  <g transform="translate(600, 190)">
    <circle cx="-22" cy="0" r="38" fill="none" stroke="#fef08a" stroke-width="9"/>
    <circle cx="22" cy="0" r="38" fill="none" stroke="#facc15" stroke-width="9"/>
    <!-- Diamond Sparkle -->
    <polygon points="-22,-44 -16,-34 -22,-24 -28,-34" fill="#ffffff"/>
  </g>

  <!-- Bride & Groom Silhouette in Full Nuptial Glory -->
  <g transform="translate(600, 490)">
    <!-- Groom (Left) in Elegant Midnight Black Suit -->
    <g transform="translate(-75, 0)">
      <!-- Head & Groom Haircut -->
      <ellipse cx="0" cy="-115" rx="22" ry="26" fill="#78350f"/>
      <!-- Suit & Shoulders -->
      <path d="M -45,-85 L 45,-85 L 50,180 L -50,180 Z" fill="#0f172a"/>
      <!-- White Shirt & Red Bowtie -->
      <polygon points="-16,-85 16,-85 0,-30" fill="#ffffff"/>
      <polygon points="-14,-80 0,-72 14,-80 0,-64" fill="#dc2626"/>
      <!-- Lapel Boutonniere Flower -->
      <circle cx="-25" cy="-60" r="6" fill="#f43f5e"/>
    </g>

    <!-- Bride (Right) in Radiant Flowing White Wedding Gown with Veil -->
    <g transform="translate(75, 0)">
      <!-- Flowing Translucent Veil -->
      <path d="M -15,-130 Q 30,-160 65,-120 Q 90,-40 100,180 L 10,180 Z" fill="#ffffff" opacity="0.45"/>
      <!-- Bride Hair & Tiara -->
      <ellipse cx="0" cy="-110" rx="20" ry="24" fill="#78350f"/>
      <path d="M -16,-125 Q 0,-140 16,-125" stroke="#facc15" stroke-width="4" fill="none"/>
      <!-- Wedding Gown Corset -->
      <path d="M -30,-80 L 30,-80 L 35,0 L -35,0 Z" fill="#ffffff"/>
      <!-- Grand Ballgown Skirt -->
      <path d="M -35,0 L 35,0 L 110,240 L -110,240 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
      <!-- Floral Bouquet in Hands -->
      <g transform="translate(-25, -20)">
        <circle cx="0" cy="0" r="16" fill="#f43f5e"/>
        <circle cx="-8" cy="-5" r="10" fill="#fb7185"/>
        <circle cx="8" cy="-5" r="10" fill="#fbcfe8"/>
        <circle cx="0" cy="6" r="10" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Title Header -->
  <text x="600" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">HOLY MATRIMONY &amp; CHURCH WEDDINGS</text>
  <text x="600" y="118" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fbcfe8" text-anchor="middle" letter-spacing="2">Victorious Royal Assembly International · Covenant Marriage Altar</text>

  <!-- Bottom Details -->
  <rect x="0" y="740" width="1200" height="60" fill="#2d0628" opacity="0.95"/>
  <text x="600" y="777" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">"What God Has Joined Together, Let Not Man Put Asunder" · Mark 10:9</text>
</svg>
