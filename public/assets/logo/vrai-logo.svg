<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img" aria-label="Victorious Royal Assembly International Official Church Seal">
  <defs>
    <!-- Upper text path for VICTORIOUS ROYAL ASSEMBLY INTERNATIONAL -->
    <path id="churchUpperArc" d="M 125,500 A 375,375 0 1,1 875,500" fill="none" />
    
    <!-- Lower text path inside the red trapezoid banner -->
    <path id="churchLowerArc" d="M 115,820 Q 500,960 885,820" fill="none" />

    <filter id="churchDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <!-- Clip path for the central photo illustration window -->
    <clipPath id="innerCenterClip">
      <circle cx="500" cy="460" r="310" />
    </clipPath>
  </defs>

  <!-- Outer Canvas Background: Pure White Clean Margin -->
  <rect width="1000" height="1000" fill="#ffffff" />

  <!-- Main Shield / Badge Silhouette with Red Trapezoidal Base -->
  <g filter="url(#churchDropShadow)">
    <!-- Red Lower Trapezoid Base with flared wings -->
    <polygon points="40,940 960,940 890,660 110,660" fill="#C8102E" stroke="#8B0000" stroke-width="3" />
    <polygon points="65,925 935,925 875,675 125,675" fill="none" stroke="#ffffff" stroke-width="4" />

    <!-- Main Circular Badge Body (Upper & Mid) -->
    <circle cx="500" cy="460" r="440" fill="#ffffff" />
    
    <!-- Outer Dark Green Rim -->
    <circle cx="500" cy="460" r="435" fill="none" stroke="#0E6317" stroke-width="10" />
    <circle cx="500" cy="460" r="425" fill="none" stroke="#ffffff" stroke-width="4" />
    <circle cx="500" cy="460" r="420" fill="none" stroke="#0E6317" stroke-width="5" />

    <!-- Vibrant Lime Green Ring Field -->
    <circle cx="500" cy="460" r="416" fill="#78B817" />

    <!-- Upper Arc Text: VICTORIOUS ROYAL ASSEMBLY INTERNATIONAL in Bold Black -->
    <text font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-size="47" font-weight="900" fill="#000000" letter-spacing="3.2">
      <textPath href="#churchUpperArc" startOffset="50%" text-anchor="middle">
        VICTORIOUS ROYAL ASSEMBLY INTERNATIONAL
      </textPath>
    </text>

    <!-- Inner Circle Border Separating Green Ring & Photo Scene -->
    <circle cx="500" cy="460" r="314" fill="#ffffff" stroke="#0E6317" stroke-width="8" />

    <!-- Central Photo & Dove Scene (Clipped into Inner Circle) -->
    <g clip-path="url(#innerCenterClip)">
      <!-- Top Half: Vibrant Lime Field -->
      <rect x="180" y="140" width="640" height="250" fill="#78B817" />

      <!-- Bottom Half: Office / Church Study Background (Blue Hue & Desk) -->
      <rect x="180" y="380" width="640" height="400" fill="#1E3A8A" />
      <!-- Soft blurred desktop lighting -->
      <path d="M 180,480 Q 500,430 820,480 L 820,780 L 180,780 Z" fill="#E2E8F0" />

      <!-- OPEN HOLY BIBLE (White Pages, Gold Edge, Scripture Text Lines) -->
      <g id="openBible">
        <!-- Bible Leather Cover Underneath -->
        <path d="M 230,520 Q 500,470 770,520 L 760,740 Q 500,770 240,740 Z" fill="#1C1917" stroke="#000000" stroke-width="4" />
        
        <!-- Left Page -->
        <path d="M 245,525 Q 495,485 498,545 L 498,725 Q 360,715 255,730 Z" fill="#FAFAF9" stroke="#D6D3D1" stroke-width="2" />
        <!-- Right Page -->
        <path d="M 502,545 Q 505,485 755,525 L 745,730 Q 640,715 502,725 Z" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="2" />

        <!-- Gilded Gold Page Edges -->
        <path d="M 245,525 L 255,730 L 265,733 L 255,530 Z" fill="#D97706" opacity="0.6" />
        <path d="M 755,525 L 745,730 L 735,733 L 745,530 Z" fill="#D97706" opacity="0.6" />

        <!-- Center Gutter / Spine Fold -->
        <line x1="500" y1="520" x2="500" y2="735" stroke="#78716C" stroke-width="4" />

        <!-- Authentic Scripture Columns (Left Page) -->
        <g fill="#292524" opacity="0.82">
          <!-- Col 1 -->
          <rect x="270" y="540" width="95" height="4" rx="2" />
          <rect x="270" y="550" width="90" height="3" rx="1.5" />
          <rect x="270" y="558" width="95" height="3" rx="1.5" />
          <rect x="270" y="566" width="88" height="3" rx="1.5" />
          <rect x="270" y="574" width="95" height="3" rx="1.5" />
          <rect x="270" y="582" width="92" height="3" rx="1.5" />
          <rect x="270" y="590" width="85" height="3" rx="1.5" />
          <rect x="270" y="598" width="95" height="3" rx="1.5" />
          <rect x="270" y="606" width="90" height="3" rx="1.5" />
          <rect x="270" y="614" width="95" height="3" rx="1.5" />
          <rect x="270" y="622" width="80" height="3" rx="1.5" />
          <!-- Col 2 -->
          <rect x="385" y="540" width="95" height="4" rx="2" />
          <rect x="385" y="550" width="92" height="3" rx="1.5" />
          <rect x="385" y="558" width="95" height="3" rx="1.5" />
          <rect x="385" y="566" width="88" height="3" rx="1.5" />
          <rect x="385" y="574" width="95" height="3" rx="1.5" />
          <rect x="385" y="582" width="90" height="3" rx="1.5" />
          <rect x="385" y="590" width="95" height="3" rx="1.5" />
          <rect x="385" y="598" width="85" height="3" rx="1.5" />
          <rect x="385" y="606" width="95" height="3" rx="1.5" />
          <rect x="385" y="614" width="92" height="3" rx="1.5" />
          <rect x="385" y="622" width="88" height="3" rx="1.5" />
        </g>

        <!-- Authentic Scripture Columns (Right Page) -->
        <g fill="#292524" opacity="0.82">
          <!-- Col 1 -->
          <rect x="520" y="540" width="95" height="4" rx="2" />
          <rect x="520" y="550" width="92" height="3" rx="1.5" />
          <rect x="520" y="558" width="95" height="3" rx="1.5" />
          <rect x="520" y="566" width="88" height="3" rx="1.5" />
          <rect x="520" y="574" width="95" height="3" rx="1.5" />
          <rect x="520" y="582" width="90" height="3" rx="1.5" />
          <rect x="520" y="590" width="95" height="3" rx="1.5" />
          <rect x="520" y="598" width="85" height="3" rx="1.5" />
          <rect x="520" y="606" width="95" height="3" rx="1.5" />
          <rect x="520" y="614" width="92" height="3" rx="1.5" />
          <!-- Col 2 -->
          <rect x="635" y="540" width="95" height="4" rx="2" />
          <rect x="635" y="550" width="90" height="3" rx="1.5" />
          <rect x="635" y="558" width="95" height="3" rx="1.5" />
          <rect x="635" y="566" width="88" height="3" rx="1.5" />
          <rect x="635" y="574" width="95" height="3" rx="1.5" />
          <rect x="635" y="582" width="92" height="3" rx="1.5" />
          <rect x="635" y="590" width="85" height="3" rx="1.5" />
          <rect x="635" y="598" width="95" height="3" rx="1.5" />
          <rect x="635" y="606" width="90" height="3" rx="1.5" />
        </g>
      </g>

      <!-- HANDS OF THE MINISTER (Resting On & Studying the Word) -->
      <g id="pastorHands">
        <!-- Left Arm Sleeve (Deep Blue Clerical/Formal Shirt) -->
        <path d="M 180,480 L 260,490 L 310,580 L 200,640 Z" fill="#2563EB" opacity="0.9" />
        
        <!-- Left Hand & Pointing Finger (Melanin Skin Tone) -->
        <path d="M 240,510 
                 C 270,505 320,515 380,515 
                 C 440,515 500,525 540,545 
                 C 545,555 540,568 525,572 
                 C 480,568 440,555 400,550 
                 L 430,575 C 440,585 435,595 420,598 
                 C 385,590 350,575 320,565 
                 L 330,600 C 335,610 325,620 310,618 
                 C 280,605 250,580 230,555 Z" 
              fill="#6B4226" stroke="#4A2E1B" stroke-width="2" />
        <!-- Knuckle & Nail Highlights -->
        <ellipse cx="530" cy="558" rx="8" ry="5" fill="#8C5835" />
        <path d="M 360,530 Q 380,535 410,535" stroke="#4A2E1B" stroke-width="2" fill="none" />
        <path d="M 330,550 Q 355,555 385,555" stroke="#4A2E1B" stroke-width="2" fill="none" />
      </g>

      <!-- WHITE DOVE IN FLIGHT (Descending with outstretched wings) -->
      <g id="holySpiritDove" filter="url(#churchDropShadow)">
        <!-- Left Wing Feathers -->
        <path d="M 500,320 
                 C 460,260 440,190 455,145 
                 C 475,170 485,210 495,260 
                 C 470,200 480,150 490,140 
                 C 505,170 510,215 515,265 
                 C 495,200 510,150 518,145 
                 C 525,180 525,230 522,275 Z" 
              fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5" />
        
        <!-- Right Wing Feathers (Spread toward top right) -->
        <path d="M 515,310 
                 C 555,250 635,190 735,225 
                 C 680,245 630,285 580,335 
                 C 655,280 720,250 745,260 
                 C 690,295 645,335 600,365 
                 C 660,320 725,295 730,310 
                 C 680,350 630,380 575,395 
                 C 625,370 680,355 675,375 
                 C 630,405 580,420 540,410 Z" 
              fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5" />

        <!-- Dove Body & Head Facing Left -->
        <path d="M 510,320 
                 C 485,310 420,315 390,325 
                 C 375,330 380,345 395,340 
                 C 425,335 460,350 490,380 
                 C 520,410 540,460 550,510 
                 C 560,525 580,515 570,490 
                 C 550,440 535,370 510,320 Z" 
              fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5" />

        <!-- Tail Feathers -->
        <path d="M 540,460 
                 C 555,485 570,530 655,565 
                 C 620,535 595,490 570,460 Z" 
              fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5" />

        <!-- Dove Eye & Orange Beak -->
        <circle cx="395" cy="332" r="3.5" fill="#000000" />
        <polygon points="385,333 370,336 386,340" fill="#EA580C" />

        <!-- Red Dove Feet / Talons Touching Bible Direction -->
        <path d="M 515,490 L 510,515 L 498,525" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round" />
        <path d="M 525,495 L 530,520 L 522,530" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </g>

    <!-- DARK GREEN RECTANGLE BADGE: V R A I -->
    <g id="vraiPlaque">
      <rect x="425" y="820" width="150" height="50" rx="4" fill="#0E6317" stroke="#ffffff" stroke-width="3" />
      <text x="500" y="856" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="10">
        VRAI
      </text>
    </g>

    <!-- RED TRAPEZOID TEXT: A.k.a Word of faith Healing & Deliverance Ministry Int'l -->
    <text font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      <textPath href="#churchLowerArc" startOffset="50%" text-anchor="middle">
        A.k.a Word of faith Healing &amp; Deliverance Ministry Int'l
      </textPath>
    </text>
  </g>
</svg>
